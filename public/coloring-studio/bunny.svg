<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <rect width="1000" height="1000" fill="white"/>
  <g fill="white" stroke="black" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- long ears -->
    <ellipse cx="380" cy="180" rx="80" ry="170" transform="rotate(-10 380 180)"/>
    <ellipse cx="620" cy="180" rx="80" ry="170" transform="rotate(10 620 180)"/>
    <ellipse cx="380" cy="180" rx="36" ry="120" transform="rotate(-10 380 180)"/>
    <ellipse cx="620" cy="180" rx="36" ry="120" transform="rotate(10 620 180)"/>

    <!-- head -->
    <circle cx="500" cy="430" r="230"/>

    <!-- cheeks -->
    <circle cx="360" cy="520" r="55"/>
    <circle cx="640" cy="520" r="55"/>

    <!-- eyes -->
    <ellipse cx="420" cy="410" rx="30" ry="38"/>
    <ellipse cx="580" cy="410" rx="30" ry="38"/>
    <circle cx="420" cy="410" r="8" fill="black"/>
    <circle cx="580" cy="410" r="8" fill="black"/>

    <!-- nose + mouth -->
    <ellipse cx="500" cy="485" rx="30" ry="22"/>
    <path d="M500 506 L500 535"/>
    <path d="M500 535 C472 560 448 565 425 570"/>
    <path d="M500 535 C528 560 552 565 575 570"/>

    <!-- body -->
    <ellipse cx="500" cy="760" rx="250" ry="175"/>

    <!-- arms -->
    <ellipse cx="255" cy="740" rx="70" ry="115"/>
    <ellipse cx="745" cy="740" rx="70" ry="115"/>

    <!-- feet -->
    <ellipse cx="415" cy="895" rx="88" ry="60"/>
    <ellipse cx="585" cy="895" rx="88" ry="60"/>

    <!-- carrot -->
    <path d="M500 700 L560 780 L485 810 Z"/>
    <path d="M500 700 L460 660"/>
    <path d="M500 700 L525 650"/>
    <path d="M500 700 L550 680"/>
  </g>
</svg>
