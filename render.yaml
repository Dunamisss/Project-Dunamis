services:
  - type: web
    name: dunamis-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: OPTIMIZER_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: CORS_ORIGIN
        value: "*"
      - key: DAILY_LIMIT
        value: 5
      - key: OPENROUTER_API_KEY
        sync: false
